name: Update podcast feeds

# What actually decides how fast an episode reaches the feeds
# -----------------------------------------------------------
# Not the schedule. GitHub delivers a small, roughly fixed number of
# scheduled runs a day for this repository, however many are asked for.
# Measured here:
#
#   24 slots a day requested   ->   5 to 11 runs delivered
#   144 slots a day requested  ->   5 runs delivered
#
# On 2026-09-12 the five runs arrived at 05:19, 09:26, 12:58, 16:02 and
# 18:18 UTC: about one every three hours, with gaps of over two hours.
# Asking for more slots does not close those gaps.
#
# So the lever is how much ground each delivered run covers. When a show is
# due, or comes due within the time the run has left, `--watch` holds the run
# open and re-checks every three minutes until the episode appears, for up to
# two hours. That window is what turns one sparse delivery into a fast
# capture, and it is measurable: the run delivered at 09:26 waited, and
# published Ça s'explique two minutes after it aired at 10:00. The same day,
# Pouvez-vous répéter la question aired at 17:00 with no run in flight and
# waited 78 minutes, because the 16:02 run only looked 45 minutes ahead and
# left.
#
# A run with nothing due still finishes in about fifteen seconds, so the long
# window costs nothing outside the windows themselves, and the watch stops as
# soon as the show's own window closes.
#
# Which shows are due is decided in `main.py` from real Eastern time, per
# weekday, so it stays correct across daylight saving and across shows that
# air at a different time on weekends.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Runs never overlap: two runs pushing to main at the same time is what used
# to need a five-attempt push retry to recover from.
concurrency:
  group: update-feeds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Offline, no network: these pin down the merge guarantees the feeds
      # depend on, so they run on every event including the scheduled ones.
      - name: Run tests
        run: python -m unittest -q

      # On a pull request the feeds are built and validated but never
      # written, so a proposed change can be checked without touching the
      # published files.
      - name: Validate feed generation
        if: github.event_name == 'pull_request'
        run: python main.py --dry-run

      # --watch keeps the run alive only while an episode is actually due;
      # every other run finishes in a few seconds.
      - name: Update feeds
        id: feeds
        if: github.event_name != 'pull_request'
        run: python main.py --watch --watch-minutes 120 --poll-seconds 180

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        env:
          CHANGED: ${{ steps.feeds.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_*.xml README.md

          if git diff --cached --quiet; then
            echo "No feed changed; nothing to commit."
            exit 0
          fi

          if [ -n "${CHANGED:-}" ]; then
            message="feeds: update ${CHANGED}"
          else
            message="feeds: update"
          fi
          git commit -m "$message"

          branch="${{ github.head_ref || github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push after 5 attempts."
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 5 ))
          done
