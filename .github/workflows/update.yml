name: Daily Feed Update

on:
  schedule:
    - cron: '*/10 11,12,13 * * *'        # Runs every 10 minutes to cover 7:00 to 8:30 EST/EDT
    - cron: '0 16,17,20,21,22,23 * * *'  # Runs near 12pm, 4pm, 6pm EST/EDT
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:      # Allows manual triggering

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Check Timezone
        id: tz
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(TZ='America/New_York' date +%-H)
            MINUTE=$(TZ='America/New_York' date +%-M)
            echo "Current time in Eastern Time: $HOUR:$MINUTE"
            if [ "$HOUR" = "7" ]; then
              echo "should_run=true" >> $GITHUB_ENV
            elif [ "$HOUR" = "8" ] && [ "$MINUTE" -le 35 ]; then
              echo "should_run=true" >> $GITHUB_ENV
            elif [ "$HOUR" = "12" ] || [ "$HOUR" = "16" ] || [ "$HOUR" = "18" ]; then
              echo "should_run=true" >> $GITHUB_ENV
            else
              echo "should_run=false" >> $GITHUB_ENV
              echo "Skipping run, as it is outside the target hours (7:00-8:30, 12:00, 16:00, 18:00 EST/EDT)."
            fi
          else
            echo "should_run=true" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        if: env.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run feed generator
        if: env.should_run == 'true'
        run: python main.py

      - name: Commit and push changes
        if: env.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f feed_*.xml
          git add README.md
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "update feeds"
            # Retry loop to handle concurrent push collisions (e.g., when push and pull_request events trigger simultaneously)
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin ${{ github.head_ref || github.ref_name }} && git push; then
                break
              fi
              # If rebase fails due to conflict, abort it
              git rebase --abort || true
              if [ $i -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi
              sleep $((RANDOM % 10 + 5))
            done
          else
            echo "No changes to commit."
          fi
