name: Daily Feed Update

on:
  schedule:
    - cron: '0 6,14,22 * * *'  # Runs 3 times a day
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:      # Allows manual triggering

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed generator
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f feed_*.xml
          git add README.md
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "update feeds"
            # Retry loop to handle concurrent push collisions (e.g., when push and pull_request events trigger simultaneously)
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin ${{ github.head_ref || github.ref_name }} && git push; then
                break
              fi
              # If rebase fails due to conflict, abort it
              git rebase --abort || true
              if [ $i -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi
              sleep $((RANDOM % 10 + 5))
            done
          else
            echo "No changes to commit."
          fi
