name: Update podcast feeds

# How often this runs, and why it is shaped this way
# --------------------------------------------------
# GitHub delivers only a fraction of the scheduled runs a workflow asks for,
# and delivers them late. Measured on this repository:
#
#   24 slots a day, dense    ->  5 to 11 runs delivered   (21% to 46%)
#   1 slot an hour           ->  1 run in 5 hours         (20%, 36 min late)
#
# Two lessons. Asking for a run every ten minutes does not give a ten minute
# reaction time. But asking for fewer runs does not make them more reliable
# either: the hourly slot was delivered no better than the dense one. The
# fraction is simply unpredictable, so the only lever on how many runs arrive
# is how many are asked for.
#
# Hence both halves of the design:
#   - Ask for a slot every ten minutes, all day. A run with nothing to do
#     finishes in about fifteen seconds, so the ones that do arrive are cheap.
#   - Make each delivered run count: when a show is due, or is due within the
#     time the run has left, `--watch` holds the run open and re-checks every
#     three minutes until the episode appears. One delivered run therefore
#     covers the whole window around a publication instead of a single instant.
#
# Which shows are due is decided in `main.py` from real Eastern time, so it
# stays correct across daylight saving without any shell date arithmetic.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Runs never overlap: two runs pushing to main at the same time is what used
# to need a five-attempt push retry to recover from.
concurrency:
  group: update-feeds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Offline, no network: these pin down the merge guarantees the feeds
      # depend on, so they run on every event including the scheduled ones.
      - name: Run tests
        run: python -m unittest -q

      # On a pull request the feeds are built and validated but never
      # written, so a proposed change can be checked without touching the
      # published files.
      - name: Validate feed generation
        if: github.event_name == 'pull_request'
        run: python main.py --dry-run

      # --watch keeps the run alive only while an episode is actually due;
      # every other run finishes in a few seconds.
      - name: Update feeds
        id: feeds
        if: github.event_name != 'pull_request'
        run: python main.py --watch --watch-minutes 45 --poll-seconds 180

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        env:
          CHANGED: ${{ steps.feeds.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_*.xml README.md

          if git diff --cached --quiet; then
            echo "No feed changed; nothing to commit."
            exit 0
          fi

          if [ -n "${CHANGED:-}" ]; then
            message="feeds: update ${CHANGED}"
          else
            message="feeds: update"
          fi
          git commit -m "$message"

          branch="${{ github.head_ref || github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push after 5 attempts."
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 5 ))
          done
