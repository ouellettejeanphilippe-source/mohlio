name: Update podcast feeds

# Why one run per hour, and not one every few minutes
# ---------------------------------------------------
# GitHub delivers only a fraction of the scheduled runs a workflow asks for,
# and delivers them late. Measured on this repository over ten days, 24
# requested slots a day produced between 5 and 11 runs, and a `*/10` window
# produced roughly one run every 35 minutes. Asking for a run every ten
# minutes therefore does not give a ten minute reaction time; it just fills
# the Actions tab.
#
# So the schedule asks for one run an hour, which is the granularity GitHub
# does deliver reliably, and the run itself does the waiting: when a show is
# due and its episode has not arrived yet, `--watch` re-checks it every three
# minutes until it shows up. Outside those windows a run takes a few seconds
# and exits. Which shows are due is decided in `main.py` from real Eastern
# time, so it stays correct across daylight saving without any shell date
# arithmetic.
on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Runs never overlap: two runs pushing to main at the same time is what used
# to need a five-attempt push retry to recover from.
concurrency:
  group: update-feeds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Offline, no network: these pin down the merge guarantees the feeds
      # depend on, so they run on every event including the scheduled ones.
      - name: Run tests
        run: python -m unittest -q

      # On a pull request the feeds are built and validated but never
      # written, so a proposed change can be checked without touching the
      # published files.
      - name: Validate feed generation
        if: github.event_name == 'pull_request'
        run: python main.py --dry-run

      # --watch keeps the run alive only while an episode is actually due;
      # every other run finishes in a few seconds.
      - name: Update feeds
        id: feeds
        if: github.event_name != 'pull_request'
        run: python main.py --watch --watch-minutes 45 --poll-seconds 180

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        env:
          CHANGED: ${{ steps.feeds.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_*.xml README.md

          if git diff --cached --quiet; then
            echo "No feed changed; nothing to commit."
            exit 0
          fi

          if [ -n "${CHANGED:-}" ]; then
            message="feeds: update ${CHANGED}"
          else
            message="feeds: update"
          fi
          git commit -m "$message"

          branch="${{ github.head_ref || github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push after 5 attempts."
              exit 1
            fi
            sleep $(( (RANDOM % 10) + attempt * 5 ))
          done
