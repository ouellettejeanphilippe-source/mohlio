name: Update podcast feeds

# What actually decides how fast an episode reaches the feeds
# -----------------------------------------------------------
# Not the schedule. GitHub delivers a handful of scheduled runs a day for
# this repository, at unpredictable times, however many are asked for.
# Measured here with 144 slots a day requested:
#
#   Mon 2026-09-14   01:23  06:35  13:16  18:40  22:05 UTC   (5 runs)
#   Tue 2026-09-15   00:30  05:15  10:06 UTC                 (3 by noon)
#
# Gaps run from 2.4 to 6.7 hours. Asking for more slots does not close them:
# 24 slots a day produced the same handful.
#
# So the lever is how much ground each delivered run covers, and the measured
# results say exactly that. On Monday, La journée aired at 14:25 Eastern with
# a run in flight and was published 10 minutes later. À la une aired at 05:06
# and waited 251 minutes: a run had been delivered at 06:35 UTC, two and a
# half hours before the window, but it only looked two hours ahead and left.
#
# Hence a four hour budget. A run that lands within four hours of a window
# stays for it, sleeping until the window opens rather than polling an
# unchanged page, then re-checking every three minutes until the episode
# appears. A run with nothing due still finishes in about fifteen seconds,
# and the watch stops as soon as the show's own window closes.
#
# This does not make the feeds instant. With five deliveries a day there are
# stretches no run can cover, and an episode airing in one of them waits for
# the next delivery. Closing those would need a trigger that actually fires
# on time, which GitHub's scheduler is not.
#
# Which shows are due is decided in `main.py` from real Eastern time, per
# weekday, so it stays correct across daylight saving and across shows that
# air at a different time on weekends.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Runs never overlap: two runs pushing to main at the same time is what used
# to need a five-attempt push retry to recover from.
concurrency:
  group: update-feeds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Offline, no network: these pin down the merge guarantees the feeds
      # depend on, so they run on every event including the scheduled ones.
      - name: Run tests
        run: python -m unittest -q

      # On a pull request the feeds are built and validated but never
      # written, so a proposed change can be checked without touching the
      # published files.
      - name: Validate feed generation
        if: github.event_name == 'pull_request'
        run: python main.py --dry-run

      - name: Configure git
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --watch keeps the run alive only while an episode is actually due;
      # every other run finishes in a few seconds. --on-change publishes each
      # episode the moment it is captured, so one that arrives early in a long
      # watch does not wait for the rest of the window to close.
      - name: Update feeds
        id: feeds
        if: github.event_name != 'pull_request'
        env:
          PUBLISH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python main.py \
            --watch --watch-minutes 240 --poll-seconds 180 \
            --on-change .github/publish.sh

      # Catches anything the run changed after its last publish, and is a no-op
      # when everything was already pushed.
      - name: Publish any remaining change
        if: github.event_name != 'pull_request'
        env:
          PUBLISH_BRANCH: ${{ github.head_ref || github.ref_name }}
          MOHLIO_CHANGED: ${{ steps.feeds.outputs.changed }}
        run: .github/publish.sh
