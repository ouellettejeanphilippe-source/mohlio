name: Upload YouTube audio to GitHub Releases

# One-time (or on-demand) job: download audio from YouTube and upload it
# as release assets so the podcast feed has permanent enclosure URLs.
# Run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      stations:
        description: 'Station slugs (comma-separated, empty = all missing)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  upload-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Download and upload audio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.stations }}" ]; then
            # Convert comma-separated to space-separated
            stations=$(echo "${{ inputs.stations }}" | tr ',' ' ')
            python youtube_setup.py --station $stations
          else
            python youtube_setup.py
          fi
